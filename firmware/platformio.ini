[env:m5stack-atoms3u]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; AtomS3U ハードウェア構成（ESP32-S3FN8: 8MB Flash / PSRAM非搭載）
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_8MB.csv

; 依存ライブラリ
lib_deps = 

build_src_filter = +<main.cpp> -<sd_flasher.cpp>

; コンパイルフラグ（PSRAM完全無効化 / USB-HID構成）
build_flags = 
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:lilygo-t-dongle-s3]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; T-Dongle-S3 ハードウェア構成（ESP32-S3 / 16MB Flash / MicroSDスロット搭載）
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

lib_deps = 
    lovyan03/LovyanGFX @ ^1.2.32

build_src_filter = +<main.cpp> +<donguri_display.cpp>
build_flags = 
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DT_DONGLE_S3=1

[env:sd-flasher]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

build_src_filter = +<sd_flasher.cpp> -<main.cpp>

build_flags = 
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
